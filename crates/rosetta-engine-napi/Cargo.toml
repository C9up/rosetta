[package]
name = "rosetta-engine-napi"
version = "0.1.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI bindings for rosetta-engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
rosetta-engine = { path = "../rosetta-engine" }
napi = { version = "2", features = ["serde-json"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
